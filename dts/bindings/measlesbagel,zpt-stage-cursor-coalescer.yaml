# SPDX-License-Identifier: MIT

description: |
  Cursor report coalescer over pointer deltas. Sends at most one report per
  report-interval-ms, summing motion in between; motion after a quiet interval
  goes out at once. Place it after cursor-quantizer.

compatible: "measlesbagel,zpt-stage-cursor-coalescer"

include: measlesbagel,zpt-stage-base.yaml

properties:
  report-interval-ms:
    type: int
    required: true
    description: Shortest time between cursor reports; 0 sends every frame
