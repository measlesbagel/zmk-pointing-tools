# SPDX-License-Identifier: MIT

description: |
  Cursor acceleration stage over normalized motion. Scales each frame by a
  sensitivity read from a curve through eight control points: point N pairs
  curve-speeds-mm-per-s[N] with curve-sensitivity-percent[N]. Between points
  the curve is a smooth monotone cubic that never overshoots a point; before
  the first point and after the last it stays flat. Sensitivities are percent
  of the cursor-transfer gain, so a curve with every point at 100 turns
  acceleration off. The defaults suit a 684 CPI trackball: 65 percent for slow
  aiming, rising through 100 percent around 45 mm/s to 283 percent for fast
  flicks.

  Ball speed is measured per frame and smoothed with speed-rise-ms while the
  ball speeds up and speed-fall-ms while it slows down. Place the stage
  before cursor-transfer so speeds are ball speeds.

compatible: "measlesbagel,zpt-stage-cursor-acceleration"

include: measlesbagel,zpt-stage-base.yaml

properties:
  curve-speeds-mm-per-s:
    type: array
    default: [0, 8, 20, 45, 90, 160, 260, 400]
    description: >
      Ball speed of each of the eight curve points, strictly increasing,
      from 0 to 10000.

  curve-sensitivity-percent:
    type: array
    default: [65, 66, 73, 99, 159, 225, 264, 283]
    description: >
      Sensitivity at each of the eight curve points, from 1 to 1000 percent of
      the cursor-transfer gain.

  speed-rise-ms:
    type: int
    default: 10
    description: >
      Time constant with which the speed estimate follows the ball speeding
      up, from 1 to 200. Shorter makes flicks accelerate sooner; longer
      smooths jitter.

  speed-fall-ms:
    type: int
    default: 5
    description: >
      Time constant with which the speed estimate follows the ball slowing
      down, from 1 to 200. Shorter stops the cursor overshooting when you stop
      to aim.
