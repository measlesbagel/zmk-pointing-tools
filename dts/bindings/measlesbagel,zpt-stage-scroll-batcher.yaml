# SPDX-License-Identifier: MIT

description: Scroll batcher stage emitting wheel steps on a report deadline

compatible: "measlesbagel,zpt-stage-scroll-batcher"

include: measlesbagel,zpt-stage-base.yaml

properties:
  steps-per-meter:
    type: int
    required: true
    description: Wheel steps emitted per metre of constrained motion at each report flush

  report-interval-ms:
    type: int
    required: true
    description: Interval between armed report flushes

  suppression:
    type: phandle
    description: Keypress suppression policy clearing pending motion while active
