# SPDX-License-Identifier: MIT

description: Text-navigation mapper emitting actions from threshold crossings on decided axis intent

compatible: "measlesbagel,zpt-stage-text-nav"

include: measlesbagel,zpt-stage-base.yaml

properties:
  horizontal-threshold-micrometers:
    type: int
    required: true
    description: Distance required to emit a horizontal text action

  vertical-threshold-micrometers:
    type: int
    required: true
    description: Distance required to emit a vertical text action

  idle-timeout-ms:
    type: int
    required: true
    description: Gap after which the gesture accumulator resets
