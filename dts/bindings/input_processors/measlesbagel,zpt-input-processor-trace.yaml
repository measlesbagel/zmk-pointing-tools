# SPDX-License-Identifier: MIT

description: Pass-through processor that records complete relative-input frames

compatible: "measlesbagel,zpt-input-processor-trace"

include: ip_zero_param.yaml

properties:
  pointing-device-id:
    type: int
    required: true
    description: Stable host-visible identifier for the originating pointing device

  stage:
    type: int
    required: true
    description: Processing stage identifier, conventionally 0 for raw and 1 for output

  label:
    type: string
    required: true
    description: Human-readable stream label advertised to host tools
