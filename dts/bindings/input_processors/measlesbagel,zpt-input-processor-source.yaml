# SPDX-License-Identifier: MIT

description: Frame-aware motion source ingress feeding one pointing-tool router

compatible: "measlesbagel,zpt-input-processor-source"

include: ip_zero_param.yaml

properties:
  source-id:
    type: int
    required: true
    description: Stable identity for raw motion received by this ingress

  resolution-cpi:
    type: int
    description: >
      Compiled sensor resolution used for source metadata. Required unless
      device is set, in which case it defaults to that entry's
      resolution-cpi.

  device:
    type: phandle
    description: >
      The measlesbagel,zpt-pointing-device entry for the sensor feeding this
      source. Frames are then labelled with the entry's current resolution,
      so a CPI preview from the tuner changes cursor speed without
      rescaling millimetre-based thresholds. The change applies at the next
      frame boundary.

  router:
    type: phandle
    required: true
    description: Router receiving reconstructed canonical source frames

  transported:
    type: boolean
    description: Mark source frames as having crossed split transport

  compact-event-code:
    type: int
    description: Relative event code carrying a compact complete split frame

  compact-transport-coalesced:
    type: boolean
    description: Mark decoded compact frames as source-coalesced
