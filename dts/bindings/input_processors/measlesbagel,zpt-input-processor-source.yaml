# SPDX-License-Identifier: MIT

description: Frame-aware motion source ingress feeding one pointing-tool router

compatible: "measlesbagel,zpt-input-processor-source"

include: ip_zero_param.yaml

properties:
  source-id:
    type: int
    required: true
    description: Stable identity for raw motion received by this ingress

  resolution-cpi:
    type: int
    required: true
    description: Compiled sensor resolution used for source metadata

  router:
    type: phandle
    required: true
    description: Router receiving reconstructed canonical source frames

  transported:
    type: boolean
    description: Mark source frames as having crossed split transport

  compact-event-code:
    type: int
    description: Relative event code carrying a compact complete split frame

  compact-transport-coalesced:
    type: boolean
    description: Mark decoded compact frames as source-coalesced
