# SPDX-License-Identifier: MIT

description: Gesture-locked relative X/Y movement to directional behavior processor

compatible: "measlesbagel,zpt-input-processor-text-nav"

include: ip_zero_param.yaml

properties:
  tuning-label:
    type: string
    default: "Text navigation"
    description: Host-facing name used by the optional runtime tuner

  horizontal-threshold:
    type: int
    required: true
    description: Horizontal movement counts required for one directional behavior tap

  vertical-threshold:
    type: int
    required: true
    description: Vertical movement counts required for one directional behavior tap

  bindings:
    type: phandle-array
    required: true
    description: Left, right, up, and down behaviors, in that order

  tap-ms:
    type: int
    required: true
    description: Time between each queued behavior press and release

  idle-timeout-ms:
    type: int
    required: true
    description: Inactivity duration that ends the current directional gesture

  activation-distance:
    type: int
    required: true
    description: Accumulated distance required before choosing an axis

  engage-ratio-percent:
    type: int
    required: true
    description: Dominant-to-minor movement ratio required to lock an axis
