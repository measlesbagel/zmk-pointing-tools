# SPDX-License-Identifier: MIT

description: Frame-aware ingress backed by an identity cursor pipeline

compatible: "measlesbagel,zpt-input-processor-pipeline"

include: ip_zero_param.yaml

properties:
  stable-id:
    type: string
    required: true
    description: Stable identity for the constructed pipeline

  source-id:
    type: int
    required: true
    description: Stable identity for raw motion received by this ingress

  resolution-cpi:
    type: int
    required: true
    description: Compiled sensor resolution used for source metadata

  transported:
    type: boolean
    description: Mark source frames as having crossed split transport

  swap-xy:
    type: boolean
    description: Swap physical X and Y before the cursor identity stage

  invert-x:
    type: boolean
    description: Invert the oriented X axis

  invert-y:
    type: boolean
    description: Invert the oriented Y axis
