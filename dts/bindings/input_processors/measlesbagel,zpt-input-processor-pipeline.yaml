# SPDX-License-Identifier: MIT

description: Frame-aware ingress backed by a composed cursor pipeline

compatible: "measlesbagel,zpt-input-processor-pipeline"

include: ip_zero_param.yaml

properties:
  stable-id:
    type: string
    required: true
    description: Stable identity for the constructed pipeline

  source-id:
    type: int
    required: true
    description: Stable identity for raw motion received by this ingress

  resolution-cpi:
    type: int
    required: true
    description: Compiled sensor resolution used for source metadata

  stages:
    type: phandles
    required: true
    description: Ordered references to independently allocated pointing-tool stages

  dispatch-budget:
    type: int
    default: 16
    description: Maximum stage and sink visits allowed for one pipeline operation

  transported:
    type: boolean
    description: Mark source frames as having crossed split transport

  compact-event-code:
    type: int
    description: Relative event code carrying a compact complete split frame

  compact-transport-coalesced:
    type: boolean
    description: Mark decoded compact frames as source-coalesced
