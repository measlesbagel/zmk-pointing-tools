name: Check host and web tools

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # CI runs the same dev tasks as local (devenv.nix) through devenv, with
  # the toolchain pinned by devenv.lock, so CI results cannot drift from a
  # local run. 'devenv tasks run repository:check' is the same check set
  # locally: C formatting, lizard complexity, host clang-tidy, cppcheck,
  # JavaScript checks/tests, and the host tests.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - name: Configure the Devenv binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv
      - name: Install Devenv
        run: nix profile add github:cachix/devenv/v2.2#devenv
      - name: Run repository checks
        run: devenv tasks run repository:check --no-tui
      - name: Run host tests with sanitizers
        run: devenv tasks run host:test:asan --no-tui

  zephyr-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history of the head branch: the script diffs
          # origin/<base>...HEAD and GitDiffCheck needs the parent of every
          # commit in the range. On stacked PRs GITHUB_BASE_REF is the parent
          # stack branch, so the range scopes to this PR's changes rather
          # than the whole stack.
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - name: Configure the Devenv binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv
      - name: Install Devenv
        run: nix profile add github:cachix/devenv/v2.2#devenv
      # Fetch the Zephyr tree at the rev pinned in devenv.lock (the same
      # rev the local west workspace uses). Only the zephyr project is
      # needed: the module-safe check subset (see docs/quality.md) never
      # touches ZMK, and the Kconfig checks are excluded. The clone target
      # is zephyr-tree/ because the repo itself tracks zephyr/module.yml,
      # so zephyr/ already exists in the checkout.
      - name: Fetch pinned Zephyr tree
        run: |
          rev=$(jq -r '.nodes.zephyr.locked.rev' devenv.lock)
          git clone --filter=blob:none --no-checkout --quiet \
            https://github.com/zmkfirmware/zephyr zephyr-tree
          git -C zephyr-tree fetch --depth 1 --quiet origin "$rev"
          git -C zephyr-tree checkout --quiet "$rev"
      # The same script and check subset as the local
      # zephyr:compliance:check task, over the PR range.
      - name: Run Zephyr compliance checks
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "$GITHUB_BASE_REF"
            range="origin/$GITHUB_BASE_REF...HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          ZEPHYR_BASE="$PWD/zephyr-tree" \
          COMPLIANCE_SCRIPT=zephyr-tree/scripts/ci/check_compliance.py \
          COMPLIANCE_RANGE="$range" \
            devenv tasks run zephyr:compliance:check --no-tui

  # Firmware unit tests: the module's ztest suites (tests/unit) run on
  # native_posix through west twister, as the local zephyr:tests dev task
  # does. Twister needs the full Zephyr tree (boards, scripts, ztest), not
  # just the compliance script, so this job fetches the pinned rev into
  # zephyr/ -- replacing the checkout's zephyr/module.yml, which is not
  # needed here (the module itself is loaded from the repo root through
  # EXTRA_ZEPHYR_MODULES, as the dev task sets it).
  zephyr-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - name: Configure the Devenv binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv
      - name: Install Devenv
        run: nix profile add github:cachix/devenv/v2.2#devenv
      # The same fetch as the zephyr-compliance job, into zephyr/ (the
      # west workspace's [zephyr] base in .west/config). The dev task
      # initializes the workspace itself (west -q init -l config) when
      # .west/ is absent, as on a CI checkout.
      - name: Fetch pinned Zephyr tree
        run: |
          rev=$(jq -r '.nodes.zephyr.locked.rev' devenv.lock)
          rm -rf zephyr
          git clone --filter=blob:none --no-checkout --quiet \
            https://github.com/zmkfirmware/zephyr zephyr
          git -C zephyr fetch --depth 1 --quiet origin "$rev"
          git -C zephyr checkout --quiet "$rev"
      - name: Run firmware unit tests (ztest via twister)
        run: devenv tasks run zephyr:tests --no-tui
