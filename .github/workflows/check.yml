name: Check host and web tools

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - run: cmake -S host -B build/host -G Ninja
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure

  c-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check C formatting
        run: |
          find src include host -type f \( -name '*.c' -o -name '*.h' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "lizard==1.23.0"
      - name: Check cyclomatic complexity
        run: |
          # Ratcheted thresholds (see docs/quality.md, issue #76):
          # firmware code at 30, test/runner harness at 40.
          lizard -l c -C 30 -w src include
          lizard -l c -C 40 -w host

  host-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests with sanitizers
        run: cmake -S host -B build/host-san -G Ninja -DZPT_ENABLE_SANITIZERS=ON
      - name: Build host tests with sanitizers
        run: cmake --build build/host-san
      - name: Run host tests under sanitizers
        run: ctest --test-dir build/host-san --output-on-failure
