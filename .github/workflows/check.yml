name: Check host and web tools

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - run: cmake -S host -B build/host -G Ninja
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure

  c-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check C formatting
        run: |
          find src include host -type f \( -name '*.c' -o -name '*.h' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "lizard==1.23.0"
      - name: Check cyclomatic complexity
        run: |
          # Ratcheted thresholds (see docs/quality.md, issue #76):
          # firmware code at 30, test/runner harness at 40.
          lizard -l c -C 30 -w src include
          lizard -l c -C 40 -w host

  c-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Configure host build with compile database
        run: cmake -S host -B build/host-tidy -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build host targets
        run: cmake --build build/host-tidy
      - name: Run clang-tidy over the host compile database
        run: run-clang-tidy -q -p build/host-tidy
      - name: Run cppcheck
        run: |
          # Expand the suppression baseline into --suppress arguments so the
          # command works on both the runner's apt cppcheck and newer local
          # versions (--suppressions-list needs cppcheck 2.14+).
          suppressions=$(grep -vE '^[[:space:]]*(#|$)' .cppcheck-suppressions | sed 's/^/--suppress=/' | tr '\n' ' ')
          # shellcheck disable=SC2086
          cppcheck --enable=warning,performance,portability --std=c11 \
            -I include --include=tooling/cppcheck/preinclude.h \
            --inline-suppr --suppress=missingIncludeSystem \
            $suppressions \
            --error-exitcode=1 src include host

  host-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests with sanitizers
        run: cmake -S host -B build/host-san -G Ninja -DZPT_ENABLE_SANITIZERS=ON
      - name: Build host tests with sanitizers
        run: cmake --build build/host-san
      - name: Run host tests under sanitizers
        run: ctest --test-dir build/host-san --output-on-failure

  zephyr-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history of the head branch: the script diffs
          # origin/<base>...HEAD and GitDiffCheck needs the parent of every
          # commit in the range. On stacked PRs GITHUB_BASE_REF is the parent
          # stack branch, so the range scopes to this PR's changes rather
          # than the whole stack.
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up West and Zephyr SDK
        uses: urob/zmk-actions/setup-sdk@v12.0.0
        with:
          toolchain: zephyr
      - name: Pull in ZMK and Zephyr modules
        uses: urob/zmk-actions/setup-zmk@v12.0.0
        id: setup-zmk
        with:
          config: config
          always-update-west: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compliance dependencies
        run: |
          # west (the Python package) is imported by check_compliance.py even
          # though the west CLI comes from setup-sdk. The requirements file
          # lives in the west workspace, not the repo checkout.
          python -m pip install --quiet west \
            -r "${{ steps.setup-zmk.outputs.workspace }}/zephyr/scripts/requirements-compliance.txt"
      - name: Run Zephyr compliance checks
        env:
          # The script diffs the module repo (it must run from the repo root
          # so GIT_TOP is this checkout) but needs Zephyr's tree for its
          # configs and tools, which setup-zmk places in a temporary
          # workspace.
          ZEPHYR_BASE: ${{ steps.setup-zmk.outputs.workspace }}/zephyr
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "$GITHUB_BASE_REF"
            range="origin/$GITHUB_BASE_REF...HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          # Module-safe subset of check_compliance.py (see docs/quality.md):
          # the Kconfig parse family assumes the Zephyr tree (a git grep of
          # SB_CONFIG_ symbols exits 1 on no-match, which the script treats
          # as fatal), and Checkpatch enforces kernel style (tabs, 80
          # columns), which conflicts with this repository's clang-format
          # style. Kconfig and devicetree correctness are already gated by
          # the firmware build.
          python "$ZEPHYR_BASE/scripts/ci/check_compliance.py" -c "$range" \
            -m ClangFormat -m DevicetreeBindings -m Nits -m YAMLLint \
            -m GitDiffCheck -m TextEncoding -m BinaryFiles
