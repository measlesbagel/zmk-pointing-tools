include:
  # USB serial and Bluetooth transports, both on by default.
  - board: nice_nano//zmk
    shield: corne_left
    artifact-name: zmk_pointing_tools_smoke
  # The Bluetooth transport doesn't apply to a split peripheral.
  - board: nice_nano//zmk
    shield: corne_right
    artifact-name: zmk_pointing_tools_smoke_peripheral
  # Each transport alone (#105).
  - board: nice_nano//zmk
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_POINTING_TOOLS_TELEMETRY_BLE=n
    artifact-name: zmk_pointing_tools_smoke_usb_only
  - board: nice_nano//zmk
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_POINTING_TOOLS_TELEMETRY_UART=n -DCONFIG_USB_CDC_ACM=n
    artifact-name: zmk_pointing_tools_smoke_bluetooth_only
  # A peripheral without USB serial leaves the telemetry service out.
  - board: nice_nano//zmk
    shield: corne_right
    cmake-args: -DCONFIG_SERIAL=n -DCONFIG_USB_CDC_ACM=n
    artifact-name: zmk_pointing_tools_smoke_peripheral_no_usb_serial
