CONFIG_ZMK_POINTING=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Compile-coverage for the pointing-device discovery table and the split
# sensor-control tunnel: the smoke keymap declares no device-table entries
# and no real sensors, but both halves must build the agent behavior, the
# central proxy, and the empty-table accessors.
CONFIG_ZMK_POINTING_TOOLS_DEVICE_TABLE=y
CONFIG_ZMK_POINTING_TOOLS_SENSOR_TUNNEL=y
