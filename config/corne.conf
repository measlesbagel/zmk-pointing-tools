CONFIG_ZMK_POINTING=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Compile coverage for the pointing-device table and the split
# sensor-control tunnel. The smoke keymap declares a device per half but no
# real sensors. The CI matrix builds both halves: the central builds the
# proxy and the peripheral builds the agent.
CONFIG_ZMK_POINTING_TOOLS_DEVICE_TABLE=y
CONFIG_ZMK_POINTING_TOOLS_SENSOR_TUNNEL=y
