# ztest harness.
CONFIG_ZTEST=y
CONFIG_TEST=y
CONFIG_RING_BUFFER=y
CONFIG_LOG=y

# Mock UART (vnd,serial) is the telemetry service's serial port.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Module under test (loaded via ZEPHYR_MODULES).
CONFIG_ZMK_POINTING_TOOLS_TELEMETRY=y
# Small queue and fast timeout keep the drop/timeout test cases short.
CONFIG_ZMK_POINTING_TOOLS_TELEMETRY_QUEUE_SIZE=8
CONFIG_ZMK_POINTING_TOOLS_TELEMETRY_HOST_TIMEOUT_MS=1000
